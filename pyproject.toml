[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flashos-python"
version = "0.1.0"
description = "Windows desktop application for inspecting Linux ISO and QEMU launch configurations"
requires-python = ">=3.12"
dependencies = ["PySide6==6.10.1"]

[project.scripts]
flashos = "flashos.app:main"

[tool.setuptools.packages.find]
include = ["flashos*"]
